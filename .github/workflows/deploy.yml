name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"] # ຫຼື ຊື່ branch ຫຼັກຂອງເຈົ້າ

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SHEET_API_URL: ${{ secrets.VITE_SHEET_API_URL }}
          VITE_SHEET_KEY: ${{ secrets.VITE_SHEET_KEY }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # ໂຟນເດີທີ່ Vite ສ້າງໃຫ້ຫຼັງຈາກ Build
          branch: gh-pages # branch ທີ່ຈະເກັບໄຟລ໌ທີ່ Build ແລ້ວ
